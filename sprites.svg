<svg viewBox="0 0 1200 260" width="1200" height="260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Shared Soot Sprite Head + Radiating Hair Lines -->
    <g id="sootBody">
      <!-- Fine Radiating Hairs -->
      <g stroke="#1C1C1C" stroke-width="1.35" stroke-linecap="round">
        <line x1="0" y1="-15" x2="0" y2="-22" />
        <line x1="8" y1="-13" x2="12" y2="-19" />
        <line x1="13" y1="-8" x2="19" y2="-12" />
        <line x1="15" y1="0" x2="22" y2="0" />
        <line x1="13" y1="8" x2="19" y2="12" />
        <line x1="8" y1="13" x2="12" y2="19" />
        <line x1="-8" y1="13" x2="-12" y2="19" />
        <line x1="-13" y1="8" x2="-19" y2="12" />
        <line x1="-15" y1="0" x2="-22" y2="0" />
        <line x1="-13" y1="-8" x2="-19" y2="-12" />
        <line x1="-8" y1="-13" x2="-12" y2="-19" />
      </g>
      <!-- Round Charcoal Body -->
      <circle cx="0" cy="0" r="15.5" fill="#1C1C1C" />
    </g>

    <!-- Eyes Centered at (0,0) so Scaling Never Shifts Position -->
    <g id="sootEyes">
      <circle cx="-4.3" cy="0" r="4.3" fill="#F2F0EA" />
      <circle cx="4.3" cy="0" r="4.3" fill="#F2F0EA" />
      <circle cx="-3.8" cy="0" r="1.5" fill="#1C1C1C" />
      <circle cx="3.8" cy="0" r="1.5" fill="#1C1C1C" />
    </g>

    <style>
      .sprite-1 { animation: drop1 8s ease-in-out infinite; }
      .sprite-2 { animation: drop2 8s ease-in-out infinite; }
      .sprite-3 { animation: drop3 8s ease-in-out infinite; }
      .sprite-4 { animation: drop4 8s ease-in-out infinite; }
      .sprite-5 { animation: drop5 8s ease-in-out infinite; }

      /* Smooth Gentle Wobble */
      .wobble-a {
        animation: gentleWobbleA 2.4s ease-in-out infinite;
      }
      .wobble-b {
        animation: gentleWobbleB 2.8s ease-in-out infinite;
      }

      /* Blink scales cleanly around (0,0) without any position shift */
      .blink {
        animation: eyeBlink 4.6s infinite;
      }
      .blink-alt {
        animation: eyeBlink 5.4s 1.7s infinite;
      }

      /* 1. Classic Standing Feet (Scaled 1.55x) */
      @keyframes drop1 {
        0%, 4%   { transform: translate(380px, -65px) scale(1.55); }
        18%, 82% { transform: translate(380px, 140px) scale(1.55); }
        92%, 100%{ transform: translate(380px, 315px) scale(1.55); }
      }

      /* 2. Wide Walking / Striding Legs */
      @keyframes drop2 {
        0%, 8%   { transform: translate(490px, -65px) scale(1.55); }
        22%, 84% { transform: translate(490px, 140px) scale(1.55); }
        94%, 100%{ transform: translate(490px, 315px) scale(1.55); }
      }

      /* 3. Low Crouching Sprite */
      @keyframes drop3 {
        0%, 12%  { transform: translate(600px, -65px) scale(1.55); }
        26%, 86% { transform: translate(600px, 152px) scale(1.55); }
        96%, 100%{ transform: translate(600px, 315px) scale(1.55); }
      }

      /* 4. Waving Tiny Arm Sprite */
      @keyframes drop4 {
        0%, 16%  { transform: translate(710px, -65px) scale(1.55); }
        30%, 88% { transform: translate(710px, 137px) scale(1.55); }
        98%, 100%{ transform: translate(710px, 315px) scale(1.55); }
      }

      /* 5. Tall Legs + Star Candy Crown */
      @keyframes drop5 {
        0%, 20%  { transform: translate(820px, -70px) scale(1.55); }
        34%, 90% { transform: translate(820px, 125px) scale(1.55); }
        100%     { transform: translate(820px, 315px) scale(1.55); }
      }

      @keyframes gentleWobbleA {
        0%, 100% { transform: rotate(-3.5deg) translateX(-1.2px); }
        50%      { transform: rotate(3.5deg) translateX(1.2px); }
      }

      @keyframes gentleWobbleB {
        0%, 100% { transform: rotate(3.5deg) translateX(1.2px); }
        50%      { transform: rotate(-3.5deg) translateX(-1.2px); }
      }

      @keyframes eyeBlink {
        0%, 46%, 50%, 94%, 98%, 100% { transform: scaleY(1); }
        48%, 96% { transform: scaleY(0.1); }
      }
    </style>
  </defs>

  <!-- Sharp-Cornered Warm Parchment Canvas -->
  <rect width="1200" height="260" fill="#F2F0EA" />

  <!-- Sprite 1: Standing with Bent Knees & Tiny Feet -->
  <g class="sprite-1">
    <g stroke="#1C1C1C" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -6 14 L -8 21 L -7 28 L -11 28" />
      <path d="M 6 14 L 8 21 L 7 28 L 11 28" />
    </g>
    <g class="wobble-a">
      <use href="#sootBody" />
      <g transform="translate(0, -1.5)">
        <g class="blink"><use href="#sootEyes" /></g>
      </g>
    </g>
  </g>

  <!-- Sprite 2: Wide Striding Legs -->
  <g class="sprite-2">
    <g stroke="#1C1C1C" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -6 14 L -13 23 L -18 28 L -21 27" />
      <path d="M 6 14 L 14 22 L 19 28 L 22 27" />
    </g>
    <g class="wobble-b">
      <use href="#sootBody" />
      <g transform="translate(0, -1.5)">
        <g class="blink-alt"><use href="#sootEyes" /></g>
      </g>
    </g>
  </g>

  <!-- Sprite 3: Crouched Low with Tucked Little Feet -->
  <g class="sprite-3">
    <g stroke="#1C1C1C" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -6 14 L -9 19 L -12 18" />
      <path d="M 6 14 L 9 19 L 12 18" />
    </g>
    <g class="wobble-a">
      <use href="#sootBody" />
      <g transform="translate(0, -1.5)">
        <g class="blink"><use href="#sootEyes" /></g>
      </g>
    </g>
  </g>

  <!-- Sprite 4: Dangling Legs + Raised Little Arm -->
  <g class="sprite-4">
    <g stroke="#1C1C1C" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -5 14 L -6 24 L -5 30" />
      <path d="M 5 14 L 7 23 L 9 29" />
    </g>
    <g class="wobble-b">
      <path d="M 14 -3 L 21 -8 L 19 -12" stroke="#1C1C1C" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <use href="#sootBody" />
      <g transform="translate(0, -1.5)">
        <g class="blink-alt"><use href="#sootEyes" /></g>
      </g>
    </g>
  </g>

  <!-- Sprite 5: Tall Long Legs + Konpeito Star Crown -->
  <g class="sprite-5">
    <g stroke="#1C1C1C" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -6 14 L -9 27 L -8 37 L -12 38" />
      <path d="M 6 14 L 9 27 L 8 37 L 12 38" />
    </g>
    <g class="wobble-a">
      <use href="#sootBody" />
      <g transform="translate(0, -1.5)">
        <g class="blink"><use href="#sootEyes" /></g>
      </g>
      <polygon points="0,-29 2.5,-23 8.5,-23 3.8,-19.5 5.5,-14 0,-17.5 -5.5,-14 -3.8,-19.5 -8.5,-23 -2.5,-23" fill="#F2F0EA" stroke="#1C1C1C" stroke-width="1.3" stroke-linejoin="round" />
    </g>
  </g>
</svg>